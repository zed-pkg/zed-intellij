name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Test, build, and verify plugin
        run: gradle --stacktrace check buildPlugin verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: zed-intellij-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
